name: evolua_frontend
description: "Frontend Flutter do Evolua para Android, iOS e Web."
publish_to: 'none'
version: 1.0.1+22

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_riverpod: ^3.0.3
  flutter_markdown: ^0.7.7+1
  go_router: ^16.2.5
  google_fonts: ^6.3.2
  image_picker: ^1.2.0
  file_picker: ^10.3.7
  http_parser: ^4.1.2
  path: ^1.9.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  intl: any
  stomp_dart_client: ^2.1.3
  url_launcher: ^6.3.2
  google_mobile_ads: ^8.0.0
  in_app_purchase: ^3.2.3
  flutter_tts: ^4.2.5
  youtube_player_iframe: ^5.2.2
  youtube_player_flutter: 9.1.3
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  cryptography: ^2.7.0
  qr_flutter: ^4.1.0
  web: ^1.1.1
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - icon.png
    - assets/branding/app_logo.png
    - assets/branding/app_logo_trimmed.png
