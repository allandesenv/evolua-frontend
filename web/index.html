<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="evolua_frontend">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>evolua_frontend</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body,
    flt-glass-pane,
    flutter-view,
    #flutter_target {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background-color: #0B1220;
      overscroll-behavior: none;
    }

    body {
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      var redirectKey = 'evolua.github_pages.redirect';
      var careSecretPrefix = 'evolua.care.claim.secret.';

      function storeCareSecret(sid, secret) {
        if (sid && secret) {
          sessionStorage.setItem(careSecretPrefix + sid, secret);
        }
      }

      function normalizeCareHashRoute() {
        var hash = window.location.hash || '';
        if (hash.indexOf('#/care/claim') !== 0) {
          return false;
        }

        var queryIndex = hash.indexOf('?');
        if (queryIndex < 0) {
          return false;
        }

        var params = new URLSearchParams(hash.substring(queryIndex + 1));
        var sid = params.get('sid') || '';
        var code = params.get('code') || '';
        var secret = params.get('k') || '';
        storeCareSecret(sid, secret);

        if (sid && code) {
          var next =
            '/evolua-frontend/care/claim?sid=' +
            encodeURIComponent(sid) +
            '&code=' +
            encodeURIComponent(code);
          history.replaceState(null, '', next);
          return true;
        }

        return false;
      }

      function normalizeLegacyCareHash() {
        if (window.location.pathname.indexOf('/care/claim') < 0) {
          return false;
        }

        var hash = window.location.hash || '';
        if (hash.indexOf('#k=') !== 0) {
          return false;
        }

        var params = new URLSearchParams(hash.substring(1));
        var query = new URLSearchParams(window.location.search);
        storeCareSecret(query.get('sid') || '', params.get('k') || '');
        history.replaceState(
          null,
          '',
          window.location.pathname + window.location.search
        );
        return true;
      }

      if (normalizeCareHashRoute()) {
        sessionStorage.removeItem(redirectKey);
        return;
      }

      var redirect = sessionStorage.getItem(redirectKey);
      if (redirect) {
        sessionStorage.removeItem(redirectKey);
        history.replaceState(null, '', redirect);
      }

      normalizeCareHashRoute();
      normalizeLegacyCareHash();
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
