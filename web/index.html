    html,
    body,
    flt-glass-pane,
    flutter-view,
    #flutter_target {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      background-color: #0B1220;
      overscroll-behavior: none;
    }

    body {
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

</head>
<body>
  <script>
    (function () {
      var redirectKey = 'evolua.github_pages.redirect';
      var careSecretPrefix = 'evolua.care.claim.secret.';

      function storeCareSecret(sid, secret) {
        if (sid && secret) {
          sessionStorage.setItem(careSecretPrefix + sid, secret);
        }
      }

      function normalizeCareHashRoute() {
        var hash = window.location.hash || '';
        if (hash.indexOf('#/care/claim') !== 0) {
          return false;
        }

        var queryIndex = hash.indexOf('?');
        if (queryIndex < 0) {
          return false;
        }

        var params = new URLSearchParams(hash.substring(queryIndex + 1));
        var sid = params.get('sid') || '';
        var code = params.get('code') || '';
        var secret = params.get('k') || '';
        storeCareSecret(sid, secret);

        if (sid && code) {
          var next =
            '/evolua-frontend/care/claim?sid=' +
            encodeURIComponent(sid) +
            '&code=' +
            encodeURIComponent(code);
          history.replaceState(null, '', next);
          return true;
        }

        return false;
      }

      function normalizeLegacyCareHash() {
        if (window.location.pathname.indexOf('/care/claim') < 0) {
          return false;
        }

        var hash = window.location.hash || '';
        if (hash.indexOf('#k=') !== 0) {
          return false;
        }

        var params = new URLSearchParams(hash.substring(1));
        var query = new URLSearchParams(window.location.search);
        storeCareSecret(query.get('sid') || '', params.get('k') || '');
        history.replaceState(
          null,
          '',
          window.location.pathname + window.location.search
        );
        return true;
      }

      if (normalizeCareHashRoute()) {
        sessionStorage.removeItem(redirectKey);
        return;
      }

      var redirect = sessionStorage.getItem(redirectKey);
      if (redirect) {
        sessionStorage.removeItem(redirectKey);
        history.replaceState(null, '', redirect);
      }

      normalizeCareHashRoute();
      normalizeLegacyCareHash();
    })();
  </script>
  <script>
  (function () {
    var isMobile =
      /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (!isMobile || !window.visualViewport) {
      return;
    }

    function isCareClaimRoute() {
      return (
        window.location.pathname.indexOf('/care/claim') >= 0 ||
        (window.location.hash || '').indexOf('#/care/claim') === 0
      );
    }

    var lastHeight = window.visualViewport.height;
    var lastBlurAt = 0;

    function blurFocusedInputWhenKeyboardCloses() {
      if (!isCareClaimRoute()) {
        lastHeight = window.visualViewport.height;
        return;
      }

      var nextHeight = window.visualViewport.height;
      var delta = nextHeight - lastHeight;
      lastHeight = nextHeight;

      if (delta < 80) {
        return;
      }

      var active = document.activeElement;
      if (!active) {
        return;
      }

      var tagName = active.tagName
        ? active.tagName.toLowerCase()
        : '';

      var isEditable =
        tagName === 'input' ||
        tagName === 'textarea' ||
        active.isContentEditable ||
        active.getAttribute('contenteditable') === 'true';

      if (!isEditable) {
        return;
      }

      var now = Date.now();
      if (now - lastBlurAt < 250) {
        return;
      }

      lastBlurAt = now;
      active.blur();

      window.dispatchEvent(new Event('resize'));
    }

    window.visualViewport.addEventListener('resize', function () {
      window.requestAnimationFrame(blurFocusedInputWhenKeyboardCloses);
    });
  })();
</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
